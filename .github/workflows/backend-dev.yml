name: Backend Dev CI

on:
  push:
    branches:
      - dev

jobs:
  dev:
    name: Dev Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Load environment variables
        run: |
          echo "DATABASE_URL=${{ secrets.DEV_DATABASE_URL }}" >> $GITHUB_ENV
          echo "JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}" >> $GITHUB_ENV
          echo "FRONTEND_URL=${{ secrets.DEV_FRONTEND_URL }}" >> $GITHUB_ENV

      - name: Run Dev Server
        run: npm run dev
